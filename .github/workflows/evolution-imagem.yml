# Compila a Evolution API 2.4.0-rc2 + patch "canal por convite" (arm64) e publica no GHCR.
# Manual (workflow_dispatch). Custo zero (minutos do GitHub). Veja whatsapp-service/evolution-patch/README.md
name: Imagem Evolution (patch canais)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EVO_REPO: EvolutionAPI/evolution-api
  EVO_TAG: 2.4.0-rc2
  EVO_SHA: 5624bdaea81c58e4db60fe2a3a8de7c48bba1e60

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Baixar a Evolution na versão exata
        run: |
          git clone --branch "$EVO_TAG" https://github.com/$EVO_REPO.git evo
          test "$(git -C evo rev-parse HEAD)" = "$EVO_SHA"

      - name: Aplicar o patch
        run: git -C evo apply --check ../canal-por-convite.patch && git -C evo apply ../canal-por-convite.patch

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/evo-arm64" >> "$GITHUB_ENV"

      - name: Compilar e publicar (linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: evo
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.EVO_TAG }}-canais2

      - name: Digest para fixar no docker-compose
        run: echo "${IMAGE}:${EVO_TAG}-canais2@${{ steps.build.outputs.digest }}"
