# Compila a Evolution API 2.4.0-rc2 + patches "canal por convite" e "mídia em canal" (arm64) e publica no GHCR.
# Manual (workflow_dispatch). Custo zero (minutos do GitHub). Veja whatsapp-service/evolution-patch/README.md
name: Imagem Evolution (patch canais)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  EVO_REPO: EvolutionAPI/evolution-api
  EVO_TAG: 2.4.0-rc2
  EVO_SHA: 5624bdaea81c58e4db60fe2a3a8de7c48bba1e60
  # canais3 = canais2 + foto com legenda em canal (@newsletter), patch midia-canal (11/11/2026)
  # canais4 = canais3 + previa de link sem alta qualidade, patch previa-link (12/11/2026)
  # canais5 = canais4 + sem a previa propria da Evolution (externalAdReply), patch previa-link (12/11/2026)
  SUFIXO: canais5

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Baixar a Evolution na versão exata
        run: |
          git clone --branch "$EVO_TAG" https://github.com/$EVO_REPO.git evo
          test "$(git -C evo rev-parse HEAD)" = "$EVO_SHA"

      - name: Aplicar os patches
        run: |
          set -e
          for p in canal-por-convite.patch midia-canal.patch previa-link.patch; do
            git -C evo apply --check "../$p"
            git -C evo apply "../$p"
          done

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/evo-arm64" >> "$GITHUB_ENV"

      - name: Compilar e publicar (linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: evo
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.EVO_TAG }}-${{ env.SUFIXO }}

      - name: Digest para fixar no docker-compose
        run: echo "${IMAGE}:${EVO_TAG}-${SUFIXO}@${{ steps.build.outputs.digest }}"
